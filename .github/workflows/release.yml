# What a tag turns into.
#
# Six binaries, one SHA256SUMS over all of them, and a GitHub release holding both. The
# install scripts ask for exactly these names -- `sloop-<target>.tar.gz` on Unix,
# `sloop-<target>.zip` on Windows, and `SHA256SUMS` beside them -- so this workflow and
# `install/` have to agree, and `ci/release-targets.sh` fails the build when they stop
# agreeing rather than leaving it to somebody's first `curl | sh`.
#
# **No version in an asset name, and that is what makes `latest` work without an API call.**
# `releases/latest/download/<asset>` is a redirect GitHub serves itself: no JSON, no token,
# no rate limit, and nothing for a shell script to parse. A version in the filename would
# mean resolving the version first, which is a dependency on `api.github.com` being up in
# order to install.
#
# **Only first-party actions here**, the same rule `cli.yml` states: a tool whose headline
# claim is about what it does *not* depend on should not hand a third-party action a checkout
# of itself, and `gh` is already on every runner.
#
# **Running this by hand is always a dry run, and it needs no switch to be one.** The two
# jobs that cannot be taken back -- creating the release and publishing to crates.io -- are
# the only two gated on the ref being a tag. Everything before them builds all six targets,
# hashes them and installs them with the real one-liners, so the whole chain can be proved
# on a branch with nothing published and nothing to undo. A tag is the real thing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Everything that can be known before a single binary is built, checked before one is.
  agree:
    name: the tag and the targets both add up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The installers and the matrix name the same six
        run: sh ci/release-targets.sh

      # **First, not last.** Both publishing jobs depend on this being true, and a tag that
      # does not match the crate version is a release nobody wants finished -- so it stops
      # here rather than after six builds, and rather than in one publishing job while the
      # other one goes ahead anyway.
      - name: The tag and the crate version are the same number
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)
          echo "tag $tag, crate $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match cli/Cargo.toml version $crate."
            echo "::error::Nothing has been built and nothing published. Set one to the other."
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: agree
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing must not hide the other five: which builds work is the whole
      # question this job exists to answer, and a release missing one architecture is worse
      # than a release that failed loudly.
      fail-fast: false
      matrix:
        include:
          # musl on Linux, so one binary runs on every distribution rather than on the ones
          # whose glibc is new enough. Static, and nothing to install beside it.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # macOS builds both on the arm runner: Apple's SDK is universal, so the x86_64
          # cross is a `--target` and nothing else.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: The toolchain for this target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # `dbus-secret-service` is what the keyring uses on Linux and it builds libdbus from
      # source under the `vendored` feature, which needs a C compiler that knows musl.
      - name: musl, and a C compiler that speaks it
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Build
        working-directory: cli
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin sloop

      # The archive holds the binary at the top level and both licences beside it. Flat, so
      # unpacking needs no `--strip-components` and no guessing at a directory name -- the
      # installers move one file out and delete the rest.
      - name: Pack it the way the installers unpack it
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          staging="staging/$target"
          mkdir -p "$staging" dist

          case "$target" in
          *windows*) binary=sloop.exe ;;
          *) binary=sloop ;;
          esac

          cp "cli/target/$target/release/$binary" "$staging/$binary"
          cp LICENSE-MIT LICENSE-APACHE "$staging/"

          case "$target" in
          *windows*)
              # `zip` is not on every Windows runner and neither is anything else that
              # writes one -- except PowerShell, which every Windows has by definition.
              # `-Path <dir>/*` puts the files at the top of the archive rather than a
              # directory holding them, which is the shape install.ps1 unpacks.
              powershell.exe -NoProfile -NonInteractive -Command \
                  "Compress-Archive -Path '$staging/*' -DestinationPath 'dist/sloop-$target.zip' -Force"
              ;;
          *)
              # Named one by one rather than `.`, so the entries are `sloop` and not
              # `./sloop`. Both unpack the same way; only one of them reads as a release
              # when somebody lists the archive before trusting it.
              tar -czf "dist/sloop-$target.tar.gz" -C "$staging" \
                  "$binary" LICENSE-MIT LICENSE-APACHE
              ;;
          esac

          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sloop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # One SHA256SUMS over every asset, in `sha256sum -c` format, so a person can check the
  # whole release with one command and the installers can look one line up.
  checksums:
    name: one SHA256SUMS over all six
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Every asset, hashed once
        run: |
          set -euo pipefail
          mkdir -p dist
          mv staging/* dist/
          cd dist
          # Sorted, so the file reads the same way twice and a diff between two releases is
          # about the hashes rather than about the order they were listed in.
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS

          # Six archives and the file listing them. A release short of one is a release that
          # 404s for whoever has that machine, and that must not be discovered by them.
          count=$(grep -c . SHA256SUMS)
          if [ "$count" -ne 6 ]; then
            echo "::error::SHA256SUMS lists $count assets, not 6"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The last thing before anything is published: run the real installers against the real
  # assets. `R21`'s round trip does this against a layout built locally; this does it against
  # the six archives this tag actually produced.
  installs:
    name: the one-liners install it (${{ matrix.os }})
    needs: checksums
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: install.sh, against what this tag built
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          HOME="$home" XDG_CONFIG_HOME="$home/.config" ZDOTDIR="$home" SHELL=/bin/bash \
            sh install/install.sh --from "$PWD/dist" --dir "$home/bin"
          "$home/bin/sloop" --version
          grep -Fq '>>> sloop >>>' "$home"/.bashrc "$home"/.bash_profile 2>/dev/null \
            || { echo "::error::no PATH block was written"; exit 1; }
          HOME="$home" XDG_CONFIG_HOME="$home/.config" ZDOTDIR="$home" \
            sh install/uninstall.sh --dir "$home/bin"
          test ! -e "$home/bin/sloop"

      - name: install.ps1, against what this tag built
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SLOOP_TEST_PATH_KEY = "Environment-sloop-release-$PID"
          $home_dir = Join-Path $env:RUNNER_TEMP "sloop-release-$PID"
          & .\install\install.ps1 -From (Join-Path $PWD 'dist') -Dir (Join-Path $home_dir 'bin')
          & (Join-Path $home_dir 'bin\sloop.exe') --version
          & .\install\uninstall.ps1 -Dir (Join-Path $home_dir 'bin') -BinaryOnly
          if (Test-Path (Join-Path $home_dir 'bin\sloop.exe')) {
              Write-Host '::error::the binary is still there after uninstall'
              exit 1
          }
          [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKeyTree($env:SLOOP_TEST_PATH_KEY, $false)

  # Only a tag publishes. A dispatch has proved everything above and stops here.
  publish:
    name: the release itself
    needs: installs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      # **A hyphen in the version makes it a prerelease, which is semver's own rule and not
      # a preference.** `releases/latest` skips prereleases, and `install.sh` with no
      # `--version` asks for exactly that -- so without this line, tagging `v0.1.0-rc.1`
      # would hand every `curl | sh` on earth a release candidate.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Built as arguments rather than as a string, so an empty one is absent rather
          # than an empty word the shell has to be trusted to drop.
          set -- --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          case "$GITHUB_REF_NAME" in
          *-*)
              set -- "$@" --prerelease
              echo "$GITHUB_REF_NAME is a prerelease; latest/download will not serve it"
              ;;
          *)
              echo "$GITHUB_REF_NAME becomes the latest release"
              ;;
          esac

          gh release create "$GITHUB_REF_NAME" "$@" dist/*

  # crates.io, which is a separate job from the release above on purpose: a missing token
  # must not take the release down with it, and a release that went out while the crate did
  # not is a thing somebody needs told rather than a thing to hide.
  #
  # **It holds the name.** `sloop` on crates.io belongs to an abandoned 2019 project, which
  # is why the package is `dbsloop` and the binary is `sloop`. A name nobody has published is
  # a name anybody can take.
  crate:
    name: dbsloop on crates.io
    needs: installs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rule 14 says never hand the owner a manual release step. The one thing a workflow
      # cannot create for itself is the token, so its absence is said here, loudly, with
      # where to put it -- rather than by a `cargo publish` that fails with "no token found"
      # three minutes into a release.
      - name: There has to be a token, and this says where it goes
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Make a token at"
            echo "::error::https://crates.io/settings/tokens with the publish-new and"
            echo "::error::publish-update scopes, and add it at Settings -> Secrets and"
            echo "::error::variables -> Actions. The GitHub release above went out fine."
            exit 1
          fi

      # A version already on crates.io cannot be published again and cannot be taken back,
      # so a re-run of this workflow says so and stops rather than failing on it.
      - name: Is this version already up?
        id: already
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)
          code=$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
            -H "User-Agent: sloop release workflow (https://github.com/DBSloop/sloop)" \
            "https://crates.io/api/v1/crates/dbsloop/$version" || echo 000)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "dbsloop $version is already on crates.io; nothing to do."
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "dbsloop $version is not on crates.io yet (HTTP $code)."
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.already.outputs.published == 'no'
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
