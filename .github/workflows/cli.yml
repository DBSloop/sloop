# The CLI's gate. Nothing merges past a red one.
#
# Only first-party actions are used here. A tool whose headline claim is about what it
# does *not* depend on should not hand a third-party action a checkout of itself, and the
# GitHub runners already ship stable Rust with rustfmt and clippy, so nothing is gained by
# doing so. The paths lists are written out twice on purpose: GitHub's workflow parser
# does not support YAML anchors.

name: cli

on:
  push:
    # The repository's default branch is `master`. `main` is listed alongside it so
    # that renaming the default later cannot silently stop CI from running.
    branches: [master, main]
    paths:
      - cli/**
      - ci/**
      - install/**
      - .github/workflows/cli.yml
      # `ci/release-targets.sh` reads the release matrix, so a change to it has to re-run
      # the check that the matrix and the installers still name the same six targets.
      - .github/workflows/release.yml
      # The community-standards job reads all of these, and a deletion is exactly the
      # change it exists to catch -- so a push that touches one has to re-run it.
      - "*.md"
      - LICENSE-*
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths:
      - cli/**
      - ci/**
      - install/**
      - .github/workflows/cli.yml
      # `ci/release-targets.sh` reads the release matrix, so a change to it has to re-run
      # the check that the matrix and the installers still name the same six targets.
      - .github/workflows/release.yml
      # The community-standards job reads all of these, and a deletion is exactly the
      # change it exists to catch -- so a push that touches one has to re-run it.
      - "*.md"
      - LICENSE-*
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `#![deny(warnings)]` belongs in CI and not in the source: a compiler upgrade must
  # never break a checkout that was working yesterday. Cargo passes `--cap-lints allow`
  # to every registry dependency, so this bites our code and nothing else.
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: cli

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # **A PostgreSQL *server*, not just a client, since `R19c4`.** Every command reads
      # its registry out of sloop's own PostgreSQL, so a sandbox is a directory and a
      # database — and a runner with only `postgresql-client` cannot host one. The harness
      # skips out loud on such a machine, which is worse than failing: it is a green tick
      # that proved nothing, and that is exactly how CI stayed red for twelve commits once.
      #
      # `SLOOP_TEST_PG_BIN` is set rather than left to a search, because the harness
      # **panics** when it is set and wrong. A mistake here is then a loud failure instead
      # of a silent skip.
      - name: A PostgreSQL server, and tell the tests where it is
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y postgresql
              # `/usr/lib/postgresql/<major>/bin`, newest first.
              bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
              ;;
            macOS)
              brew install postgresql@16
              bin="$(brew --prefix postgresql@16)/bin"
              ;;
            Windows)
              # The runner ships the whole thing and leaves it off `PATH`.
              bin=$(ls -d "/c/Program Files/PostgreSQL"/*/bin | sort -V | tail -1)
              ;;
          esac

          for program in initdb pg_ctl postgres psql; do
            if [ ! -x "$bin/$program" ] && [ ! -x "$bin/$program.exe" ]; then
              echo "::error::$bin has no $program — the tests cannot host a database"
              exit 1
            fi
          done

          # **A Windows path for the Windows binary.** This step runs in bash, so `$bin` is
          # `/c/Program Files/...`, and the tests are a Rust program that asks Windows to
          # open it — which it cannot. `PATH` takes the bash spelling; the variable the tests
          # read takes the native one.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SLOOP_TEST_PG_BIN=$(cygpath -w "$bin")" >> "$GITHUB_ENV"
          else
            echo "SLOOP_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          echo "using $bin"

      - name: Every runner has one, so nothing below quietly skips
        working-directory: .
        shell: bash
        run: |
          psql --version
          initdb --version

      - run: cargo test --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # This job asks whether the crate still compiles on the oldest toolchain we claim,
      # not whether that toolchain agrees with today's lints.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Take the MSRV from Cargo.toml, so there is one place it is written
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv" || { echo "cli/Cargo.toml has no rust-version"; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          echo "Claimed MSRV: $msrv"
      - name: Install that toolchain
        run: rustup toolchain install "$MSRV" --profile minimal --no-self-update
      - name: A claimed MSRV that does not build is a lie in the package metadata
        run: cargo "+$MSRV" check --all-targets --all-features

  postgres:
    name: postgres ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide the others: which majors work is the whole
      # question this job exists to answer.
      fail-fast: false
      matrix:
        # Adding a major is one line here, and nothing else.
        version: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.version }} from PGDG
        working-directory: .
        # The upstream repository, because Ubuntu ships one major and this job is about
        # several. `apt.postgresql.org.sh` is PostgreSQL's own setup script, which handles
        # the signing key so this workflow does not have to.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.version }}"
          "/usr/lib/postgresql/${{ matrix.version }}/bin/initdb" --version

      - name: Dump and restore against it
        env:
          # Set, so the tests use this major and no other — and fail rather than skip if it
          # is not where they were told to look.
          SLOOP_TEST_PG_BIN: /usr/lib/postgresql/${{ matrix.version }}/bin
        run: cargo test --bin sloop engine::cluster_tests -- --nocapture

  # One version each, which is what these two ship in the distribution. Several majors is
  # the shape the `postgres` job above already has — a matrix and a vendor repository — and
  # it goes here the same way if it is ever wanted. A one-entry matrix in the meantime would
  # only be a version number waiting to go stale.
  mysql:
    name: mysql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server
          # The tests build a server of their own in a temporary directory, and Ubuntu's
          # AppArmor profile confines `mysqld` to `/var/lib/mysql` — so without this the
          # data directory cannot be written, and the failure is about permissions rather
          # than about sloop. The packaged server is stopped for a related reason: nothing
          # here talks to it, and it should not be holding port 3306 either.
          sudo systemctl stop mysql || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          /usr/sbin/mysqld --version

      - name: Dump and restore against it
        env:
          # Set, so the tests use this server and no other — and fail rather than skip if
          # it is not where they were told to look. It names the directory of the *client*
          # programs; Debian and Ubuntu put the daemon in `/usr/sbin`, which the harness
          # knows to look in.
          SLOOP_TEST_MYSQL_BIN: /usr/bin
        # One at a time: each test starts a database server, and three of those at once on
        # a shared runner turns a real failure into a timeout that looks like one.
        run: cargo test --bin sloop engine::mysql_cluster_tests::mysql -- --nocapture --test-threads=1

  mariadb:
    name: mariadb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl stop mariadb || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          /usr/sbin/mariadbd --version

      - name: Dump and restore against it
        env:
          SLOOP_TEST_MARIADB_BIN: /usr/bin
        run: cargo test --bin sloop engine::mysql_cluster_tests::mariadb -- --nocapture --test-threads=1

  community:
    name: the repository a stranger can trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every item on GitHub's community-standards checklist, present and written. Rule 14:
      # a page somebody ticked off once is a page a tidy-up quietly un-ticks.
      - name: Every community-standards item is there
        working-directory: .
        run: sh ci/community-standards.sh

      # `cli/Cargo.toml` says `readme = "../README.md"`, which is what makes the crates.io
      # page and the repository's front page the same file. Cargo's resolution is Cargo's,
      # so the packaged copy is unwrapped and compared rather than trusted -- a divergence
      # here is invisible until somebody lands on crates.io and reads the wrong thing.
      - name: The crate publishes the repository's README, byte for byte
        working-directory: .
        run: |
          set -euo pipefail
          cargo package --manifest-path cli/Cargo.toml --no-verify --allow-dirty
          crate=$(ls cli/target/package/dbsloop-*.crate | head -n 1)
          test -n "$crate" || { echo "::error::cargo package produced no .crate"; exit 1; }
          tar -xzf "$crate" -C cli/target/package
          packaged=$(ls -d cli/target/package/dbsloop-*/ | head -n 1)README.md
          if ! diff -u README.md "$packaged"; then
            echo "::error::the packaged README is not the repository's README"
            exit 1
          fi
          echo "crates.io will render the same README this repository shows"

  guarantee:
    name: nothing opens a socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One runner is enough: the check passes `--target all`, so a dependency hiding
      # behind `cfg(windows)` is caught from here.
      - name: cargo tree must contain nothing that can open a socket
        working-directory: .
        run: sh ci/no-http-client.sh

  # The installer is the one piece of a release nobody runs until a stranger runs it, and
  # rule 14 says a concern that is only stated is a concern that gets forgotten. So it is
  # run: on all three platforms, against the binary this commit produced, laid out as a
  # release with its SHA256SUMS beside it. See ci/install-roundtrip.sh for what is asserted.
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: The binary the release would carry
        run: cargo build --bin sloop

      - name: Install it, then take it off again
        if: runner.os != 'Windows'
        working-directory: .
        shell: bash
        run: sh ci/install-roundtrip.sh cli/target/debug/sloop

      # Windows PowerShell 5.1, not pwsh 7: `irm | iex` on a stock Windows runs in 5.1, and
      # that is the parser the script has to survive.
      - name: Install it, then take it off again
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: .\ci\install-roundtrip.ps1 -Binary cli\target\debug\sloop.exe

  # A systemd unit systemd refuses, a launchd plist launchd will not load, a Windows service
  # that never reports RUNNING and is killed for it -- none of those are visible in the text
  # of the definition, and the text is all a unit test can see. So the real service manager is
  # asked, on each of the three machines that has one. Rule 14.
  service:
    name: it registers as a service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - run: cargo build --bin sloop

      - name: Register it, drive it, remove it
        if: runner.os != 'Windows'
        working-directory: .
        shell: bash
        run: sudo sh ci/service-roundtrip.sh cli/target/debug/sloop

      # Windows PowerShell 5.1, and the runner's own account is already an administrator.
      - name: Register it, drive it, remove it
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: .\ci\service-roundtrip.ps1 -Sloop cli\target\debug\sloop.exe

  scripts:
    name: the install scripts hold up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Non-ASCII in a .ps1 is a parse failure on Windows PowerShell 5.1 whose cause is
      # invisible in the diff. The check exists because that cost a debugging session once.
      - name: Every byte of them is ASCII
        working-directory: .
        run: sh ci/ascii-scripts.sh

      # The installers ask for six archives by name and the release workflow builds six.
      # Nothing else watches that seam, and when it slips the failure lands on a stranger
      # with the one machine nobody had, as a 404 from curl.
      - name: The installers and the release matrix name the same targets
        working-directory: .
        run: sh ci/release-targets.sh

      - name: shellcheck
        working-directory: .
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --shell=sh --severity=style \
            install/install.sh install/uninstall.sh \
            ci/install-roundtrip.sh ci/ascii-scripts.sh ci/no-http-client.sh \
            ci/release-targets.sh ci/service-roundtrip.sh ci/community-standards.sh

      # A syntax error in an installer is a release that cannot be installed, and the file
      # is only ever read by a machine that has already been told to run it.
      - name: PowerShell parses both of them
        working-directory: .
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in @('install/install.ps1', 'install/uninstall.ps1', 'ci/install-roundtrip.ps1', 'ci/service-roundtrip.ps1')) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $file), [ref] $null, [ref] $errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $bad = 1
                  Write-Host "::error file=$file::$($errors[0].Message)"
              } else {
                  Write-Host "$file parses"
              }
          }
          exit $bad
