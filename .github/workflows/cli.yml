# The CLI's gate. Nothing merges past a red one.
#
# Only first-party actions are used here. A tool whose headline claim is about what it
# does *not* depend on should not hand a third-party action a checkout of itself, and the
# GitHub runners already ship stable Rust with rustfmt and clippy, so nothing is gained by
# doing so. The paths lists are written out twice on purpose: GitHub's workflow parser
# does not support YAML anchors.

name: cli

on:
  push:
    # The repository's default branch is `master`. `main` is listed alongside it so
    # that renaming the default later cannot silently stop CI from running.
    branches: [master, main]
    paths:
      - cli/**
      - ci/**
      - .github/workflows/cli.yml
  pull_request:
    paths:
      - cli/**
      - ci/**
      - .github/workflows/cli.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `#![deny(warnings)]` belongs in CI and not in the source: a compiler upgrade must
  # never break a checkout that was working yesterday. Cargo passes `--cap-lints allow`
  # to every registry dependency, so this bites our code and nothing else.
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: cli

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # **A PostgreSQL *server*, not just a client, since `R19c4`.** Every command reads
      # its registry out of sloop's own PostgreSQL, so a sandbox is a directory and a
      # database — and a runner with only `postgresql-client` cannot host one. The harness
      # skips out loud on such a machine, which is worse than failing: it is a green tick
      # that proved nothing, and that is exactly how CI stayed red for twelve commits once.
      #
      # `SLOOP_TEST_PG_BIN` is set rather than left to a search, because the harness
      # **panics** when it is set and wrong. A mistake here is then a loud failure instead
      # of a silent skip.
      - name: A PostgreSQL server, and tell the tests where it is
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y postgresql
              # `/usr/lib/postgresql/<major>/bin`, newest first.
              bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
              ;;
            macOS)
              brew install postgresql@16
              bin="$(brew --prefix postgresql@16)/bin"
              ;;
            Windows)
              # The runner ships the whole thing and leaves it off `PATH`.
              bin=$(ls -d "/c/Program Files/PostgreSQL"/*/bin | sort -V | tail -1)
              ;;
          esac

          for program in initdb pg_ctl postgres psql; do
            if [ ! -x "$bin/$program" ] && [ ! -x "$bin/$program.exe" ]; then
              echo "::error::$bin has no $program — the tests cannot host a database"
              exit 1
            fi
          done

          echo "SLOOP_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
          echo "using $bin"

      - name: Every runner has one, so nothing below quietly skips
        working-directory: .
        shell: bash
        run: |
          psql --version
          initdb --version

      - run: cargo test --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # This job asks whether the crate still compiles on the oldest toolchain we claim,
      # not whether that toolchain agrees with today's lints.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Take the MSRV from Cargo.toml, so there is one place it is written
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv" || { echo "cli/Cargo.toml has no rust-version"; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          echo "Claimed MSRV: $msrv"
      - name: Install that toolchain
        run: rustup toolchain install "$MSRV" --profile minimal --no-self-update
      - name: A claimed MSRV that does not build is a lie in the package metadata
        run: cargo "+$MSRV" check --all-targets --all-features

  postgres:
    name: postgres ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide the others: which majors work is the whole
      # question this job exists to answer.
      fail-fast: false
      matrix:
        # Adding a major is one line here, and nothing else.
        version: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.version }} from PGDG
        working-directory: .
        # The upstream repository, because Ubuntu ships one major and this job is about
        # several. `apt.postgresql.org.sh` is PostgreSQL's own setup script, which handles
        # the signing key so this workflow does not have to.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.version }}"
          "/usr/lib/postgresql/${{ matrix.version }}/bin/initdb" --version

      - name: Dump and restore against it
        env:
          # Set, so the tests use this major and no other — and fail rather than skip if it
          # is not where they were told to look.
          SLOOP_TEST_PG_BIN: /usr/lib/postgresql/${{ matrix.version }}/bin
        run: cargo test --bin sloop engine::cluster_tests -- --nocapture

  # One version each, which is what these two ship in the distribution. Several majors is
  # the shape the `postgres` job above already has — a matrix and a vendor repository — and
  # it goes here the same way if it is ever wanted. A one-entry matrix in the meantime would
  # only be a version number waiting to go stale.
  mysql:
    name: mysql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server
          # The tests build a server of their own in a temporary directory, and Ubuntu's
          # AppArmor profile confines `mysqld` to `/var/lib/mysql` — so without this the
          # data directory cannot be written, and the failure is about permissions rather
          # than about sloop. The packaged server is stopped for a related reason: nothing
          # here talks to it, and it should not be holding port 3306 either.
          sudo systemctl stop mysql || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          /usr/sbin/mysqld --version

      - name: Dump and restore against it
        env:
          # Set, so the tests use this server and no other — and fail rather than skip if
          # it is not where they were told to look. It names the directory of the *client*
          # programs; Debian and Ubuntu put the daemon in `/usr/sbin`, which the harness
          # knows to look in.
          SLOOP_TEST_MYSQL_BIN: /usr/bin
        # One at a time: each test starts a database server, and three of those at once on
        # a shared runner turns a real failure into a timeout that looks like one.
        run: cargo test --bin sloop engine::mysql_cluster_tests::mysql -- --nocapture --test-threads=1

  mariadb:
    name: mariadb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl stop mariadb || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          /usr/sbin/mariadbd --version

      - name: Dump and restore against it
        env:
          SLOOP_TEST_MARIADB_BIN: /usr/bin
        run: cargo test --bin sloop engine::mysql_cluster_tests::mariadb -- --nocapture --test-threads=1

  guarantee:
    name: no HTTP client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One runner is enough: the check passes `--target all`, so a dependency hiding
      # behind `cfg(windows)` is caught from here.
      - name: cargo tree must contain nothing that can open a socket
        working-directory: .
        run: sh ci/no-http-client.sh
