name: Feature request
description: Something sloop should be able to do and cannot.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The [Roadmap](https://github.com/DBSloop/sloop#roadmap) lists what is already
        planned. If yours is on it, add to that issue instead of opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the feature. What are you doing today instead?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What sloop would do
      description: If it is a command or a flag, write the line you would type.
      placeholder: sloop backup orders --to s3://bucket/path
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Which engines this is about
      multiple: true
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - All of them
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Which platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All of them
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Another tool, a script, a different shape for this. Optional.

  - type: checkboxes
    id: constraints
    attributes:
      label: Two things sloop will not do
      description: >
        These are the project's fixed constraints, not a formality. A feature that needs
        either one is refused however useful it is.
      options:
        - label: >
            This does not need an HTTP client in the binary. sloop's guarantee is that
            `cargo tree` shows none, so anything touching the network shells out to the
            system's own downloader after the user agrees.
          required: true
        - label: >
            This does not need a password written in plaintext anywhere — not in a config
            file, not in a log, not in a filename, not in `ps` output.
          required: true
