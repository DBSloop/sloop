<!--
  The navbar.

  Three things, left to right: the lockup, the tabs with Docs as the primary
  one, and the three-way theme control. No hamburger at any width — on a phone
  the tabs lose their labels' padding and GitHub loses its word, but Docs never
  hides behind a menu.
-->
<header
  class="sticky top-0 z-50 border-b border-line bg-bg/80 backdrop-blur-md supports-[backdrop-filter]:bg-bg/60"
>
  <div class="mx-auto flex max-w-[84rem] items-center gap-3 px-5 py-3.5 sm:gap-5 sm:px-8 lg:px-12">
    <!--
      The lockup: three stones resting on water.

      The waterline runs 29px down a 36px mark, so the bottom pebble is
      genuinely in the water rather than balanced on a line. Below it, all
      aria-hidden: a mirrored copy of the mark and the word, the water itself,
      and the surface.

      The surface is a wave, not an edge — five half-periods of uneven length
      and height, so it reads as water rather than as a repeating pattern, and
      small enough to be a beach rather than a storm. The same path clips the
      water and the reflection.

      The reflection mirrors about the waterline and is foreshortened to 55%:
      translateY(21.95px) then scaleY(-0.55) maps y to 21.95 - 0.55y, which puts
      the waterline on itself. Water compresses what it reflects; an
      uncompressed mirror at 36px reads as a smudge.

      Three layers, and the order is the point. The surface line sits BEHIND the
      stones — a bright 1px stroke drawn across a 36px stone reads as a scratch
      at actual size — while the water itself sits IN FRONT, so the bottom
      pebble is under it rather than merely behind it.

      Every edge of the water is a fade: transparent at x=0 so it emerges from
      under the mark, transparent at the right where it runs out, masked to
      nothing at depth. The only hard line in it is the wave.

      It is hidden below 640px. At 390 the bar holds the lockup, Docs, GitHub
      and the theme control in 350px with 30px to spare, and 200px of water
      would have to run under the tabs to fit. Rule 9: ornament that earns its
      place, or none — on a phone this does not.
    -->
    <a
      routerLink="/"
      class="relative flex shrink-0 items-center gap-2.5 rounded-md focus-visible:outline-offset-4 sm:gap-3"
      aria-label="sloop — home"
    >
      <span
        aria-hidden="true"
        class="pointer-events-none absolute left-0 top-[23px] z-0 hidden h-[18px] w-[200px] sm:block"
      >
        <span
          class="absolute inset-0 block opacity-40 [clip-path:url(#nav-water-edge)] [mask-image:linear-gradient(to_bottom,#000_20%,transparent_96%)]"
        >
          <span
            class="flex h-9 origin-top-left items-center gap-3 [transform:translateY(21.95px)_scaleY(-0.55)]"
          >
            <app-mark class="h-9 w-9 shrink-0 text-brand" />
            <span class="font-mono text-base font-semibold tracking-tight">sloop</span>
          </span>
        </span>

        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 200 18" focusable="false">
          <defs>
            <clipPath id="nav-water-edge" clipPathUnits="userSpaceOnUse">
              <path
                d="M0 6c10.5-3.17 31.5-3.17 42 0c9 2.38 27 2.38 36 0c11.5-3.43 34.5-3.43 46 0c9.5 2.11 28.5 2.11 38 0c9.5-2.9 28.5-2.9 38 0L200 18L0 18Z"
              />
            </clipPath>
            <linearGradient id="nav-water-depth" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0.25" stop-color="#fff" />
              <stop offset="1" stop-color="#000" />
            </linearGradient>
            <mask
              id="nav-water-deep"
              maskUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="200"
              height="18"
            >
              <rect width="200" height="18" fill="url(#nav-water-depth)" />
            </mask>
            <linearGradient id="nav-water-body" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="rgb(var(--ch-brand))" stop-opacity="0" />
              <stop offset="0.07" stop-color="rgb(var(--ch-brand))" stop-opacity="0.3" />
              <stop offset="0.35" stop-color="rgb(var(--ch-brand))" stop-opacity="0.14" />
              <stop offset="0.7" stop-color="rgb(var(--ch-brand))" stop-opacity="0.05" />
              <stop offset="1" stop-color="rgb(var(--ch-brand))" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="nav-water-surface" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="rgb(var(--ch-text))" stop-opacity="0" />
              <stop offset="0.06" stop-color="rgb(var(--ch-text))" stop-opacity="0.6" />
              <stop offset="0.42" stop-color="rgb(var(--ch-text))" stop-opacity="0.2" />
              <stop offset="0.9" stop-color="rgb(var(--ch-text))" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path
            d="M0 6c10.5-3.17 31.5-3.17 42 0c9 2.38 27 2.38 36 0c11.5-3.43 34.5-3.43 46 0c9.5 2.11 28.5 2.11 38 0c9.5-2.9 28.5-2.9 38 0"
            fill="none"
            stroke="url(#nav-water-surface)"
            stroke-width="1"
          />
        </svg>
      </span>

      <app-mark label="sloop" class="relative z-10 h-8 w-8 shrink-0 text-brand sm:h-9 sm:w-9" />
      <span class="relative z-10 font-mono text-base font-semibold tracking-tight">sloop</span>

      <span
        aria-hidden="true"
        class="pointer-events-none absolute left-0 top-[23px] z-20 hidden h-[18px] w-[200px] sm:block"
      >
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 200 18" focusable="false">
          <path
            d="M0 6c10.5-3.17 31.5-3.17 42 0c9 2.38 27 2.38 36 0c11.5-3.43 34.5-3.43 46 0c9.5 2.11 28.5 2.11 38 0c9.5-2.9 28.5-2.9 38 0L200 18L0 18Z"
            fill="url(#nav-water-body)"
            mask="url(#nav-water-deep)"
          />
        </svg>
      </span>
    </a>

    <!-- Docs is the primary tab: filled, not merely bolder. -->
    <nav class="ml-auto flex items-center gap-1 sm:gap-2" aria-label="Main">
      <a
        routerLink="/docs"
        routerLinkActive="ring-1 ring-brand/50"
        class="rounded-full bg-brand px-3.5 py-2 text-sm font-semibold text-brand-ink transition-[background-color,transform,box-shadow] duration-2 ease-out hover:bg-brand/90 hover:shadow-glow active:translate-y-px sm:px-4"
        >Docs</a
      >
      <a
        href="https://github.com/DBSloop/sloop"
        rel="noreferrer"
        class="flex items-center gap-2 rounded-full border border-line px-3 py-2 text-sm font-medium text-muted transition-colors duration-2 ease-out hover:border-line-strong hover:text-text sm:px-3.5"
      >
        <svg
          class="h-4 w-4 shrink-0"
          viewBox="0 0 16 16"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M8 .2a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0 0 8 .2z"
          />
        </svg>
        <span class="hidden sm:inline">GitHub</span>
      </a>
    </nav>

    <!--
      Three positions, not a toggle. System is the middle one because it sits
      between the two it chooses from, and because that is the order a reader
      expects: lightest, automatic, darkest.

      A group of pressed buttons rather than role="radiogroup": a radiogroup
      promises arrow-key navigation with a roving tabindex, and promising that
      without implementing it is worse than not claiming it. These are three
      buttons, each reachable with Tab and each announcing whether it is the one
      in effect.
    -->
    <div
      class="flex shrink-0 items-center gap-0.5 rounded-full border border-line bg-surface p-1"
      role="group"
      aria-label="Theme"
    >
      @for (option of themes; track option.value) {
        <button
          type="button"
          [attr.aria-pressed]="choice() === option.value"
          [attr.title]="option.label"
          [class]="
            choice() === option.value
              ? 'bg-accent-soft text-accent ring-1 ring-accent/25'
              : 'text-faint hover:bg-surface-2 hover:text-muted'
          "
          class="grid h-8 w-8 place-items-center rounded-full transition-[color,background-color] duration-2 ease-out"
          (click)="select(option.value)"
        >
          <span class="sr-only">{{ option.label }}</span>
          <svg
            class="h-4 w-4"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path [attr.d]="option.path" />
            @if (option.extra) {
              <path [attr.d]="option.extra" />
            }
          </svg>
        </button>
      }
    </div>
  </div>
</header>
