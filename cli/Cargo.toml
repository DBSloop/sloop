[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DBSloop/sloop"
homepage = "https://dbsloop.github.io"

[package]
name = "dbsloop"
description = "Register your databases once, then back them up, restore, mirror and sync them. No credential ever leaves the machine."
categories = ["command-line-utilities", "database"]
keywords = ["backup", "restore", "postgresql", "mysql", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The command is `sloop`; the crate is `dbsloop`, because `sloop` on crates.io belongs to
# an abandoned 2019 project. Cargo lets the two be named independently.
[[bin]]
name = "sloop"
path = "src/main.rs"

[dependencies]
# `clap` is the whole dependency list for now, and the graph stays auditable on purpose:
# the guarantee is that `cargo tree` shows nothing here that could open a socket.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# Both of these are already in the graph underneath clap. Naming them here costs no
# new crate and buys the two things every printed line needs: colour that disappears
# when the destination is a pipe or NO_COLOR is set, and the width to fit inside.
anstream = "1.0"
terminal_size = "0.4"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
getrandom = "0.4.3"
rpassword = "7.5.4"
# SHA-256, for proving a downloaded archive is the one that was pinned — and, from R9, for
# the checksum in a backup manifest. RustCrypto, like `argon2` above, and no more than a
# hash function: nothing in it can open a socket.
sha2 = "0.10"
# `manifest.json` is written and read back by `backups list`, `prune` and `restore`, so the
# format needs a real parser rather than a printer. It was already a dev-dependency for the
# test that publishes `web/privileges.json`, so this moves an edge rather than adding a
# crate to the lockfile.
serde_json = "1.0"
# The one thing arithmetic cannot answer: which timezone this machine is in. `backup/stamp`
# does its own calendar maths and uses this for nothing but the offset from UTC at a given
# moment — historical offsets included, so a backup taken in July still reads back as July's
# wall clock in December. Default features off: `clock` and `std` are all of it, and the
# whole graph it brings is `num-traits` plus the platform's own timezone lookup. No socket
# anywhere in it.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
# There is no reason for this tool to contain unsafe code, and "no reason yet" is how it
# gets in. CI adds `-D warnings` on top; the source does not, so a compiler upgrade
# cannot break a working checkout.
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set. The interactive UI owns the alternate screen
# buffer and has to give the terminal back on the way out of a panic, and unwinding is
# what runs the guard that does it.
